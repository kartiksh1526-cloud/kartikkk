<script>

/* =========================================
THEME
========================================= */

const themeToggle =
document.getElementById("themeToggle");


function applyTheme(theme){

const normalizedTheme =
theme === "light" ? "light" : "dark";

document.documentElement
.setAttribute("data-theme",normalizedTheme);

themeToggle.textContent =
normalizedTheme === "dark"
? "🌙 Dark"
: "☀️ Light";

themeToggle.setAttribute(
"aria-pressed",
normalizedTheme === "light" ? "true" : "false"
);

localStorage.setItem(
"docushield-theme",
normalizedTheme
);

}


applyTheme(
localStorage.getItem("docushield-theme")
|| "dark"
);


if(themeToggle){

themeToggle.addEventListener(
"click",
()=>{

const current =
document.documentElement
.getAttribute("data-theme");

applyTheme(
current === "dark"
? "light"
: "dark"
);

});

}


/* =========================================
GET ALL APPLICATIONS
========================================= */

function getApplications(){

let applications = [];


/*
Main history array
*/

try{

const history =
JSON.parse(
localStorage.getItem(
"verifyflowApplications"
) || "[]"
);

if(Array.isArray(history)){
applications = history;
}

}catch(error){

applications=[];

}


/*
Current application ko bhi check karo
*/

try{

const current =
JSON.parse(
localStorage.getItem(
"verifyflowApplication"
) || "null"
);


if(current){

const exists =
applications.some(
app =>
app.applicationId ===
current.applicationId
);


if(!exists){

applications.push(current);

}

}

}catch(error){

console.log(error);

}


/*
Latest first
*/

 applications.sort(
 (a,b)=>
 new Date(
 b.createdAt || b.submittedAt || 0
 ) -
 new Date(
 a.createdAt || a.submittedAt || 0
 )
 );


return applications;

}


/* =========================================
SAVE ALL
========================================= */

function saveApplications(applications){

localStorage.setItem(
"verifyflowApplications",
JSON.stringify(
applications
)
);

}


/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

const div =
document.createElement("div");

div.textContent =
value == null
? ""
: String(value);

return div.innerHTML;

}


/* =========================================
DATE
========================================= */

function formatDate(date){

if(!date){
return "—";
}

try{

return new Date(date)
.toLocaleString(
"en-IN",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}catch(error){

return "—";

}

}


/* =========================================
FILE SIZE
========================================= */

function formatSize(bytes){

if(!bytes){
return "—";
}

if(bytes < 1024){

return bytes+" B";

}

if(bytes < 1024*1024){

return (
(bytes/1024)
.toFixed(1)
+" KB"
);

}

return (
(bytes/(1024*1024))
.toFixed(1)
+" MB"
);

}


/* =========================================
STATUS
========================================= */

function normalizeStatus(status){

status =
(status || "pending")
.toLowerCase();


if(status === "verified"){
return "verified";
}

if(status === "rejected"){
return "rejected";
}

return "pending";

}


/* =========================================
INITIALS
========================================= */

function getInitials(name){

if(!name){
return "AP";
}

return name
.split(" ")
.filter(Boolean)
.slice(0,2)
.map(word =>
word.charAt(0)
.toUpperCase()
)
.join("");

}


/* =========================================
DOCUMENT ICON
========================================= */

function documentIcon(doc){

const text =
(
doc.documentType ||
doc.title ||
""
).toLowerCase();


if(
text.includes("photo")
){
return "📷";
}

if(
text.includes("pan") ||
text.includes("tax")
){
return "💳";
}

if(
text.includes("address")
){
return "🏠";
}

if(
text.includes("government") ||
text.includes("identity") ||
text.includes("id")
){
return "🪪";
}

return "📄";

}


/* =========================================
UPDATE STATS
========================================= */

function updateStats(applications){

let verified=0;
let pending=0;
let rejected=0;


applications.forEach(app=>{

const status =
normalizeStatus(
app.status
);


if(status==="verified"){
verified++;
}

else if(status==="rejected"){
rejected++;
}

else{
pending++;
}

});


document.getElementById(
"totalApplications"
).textContent =
applications.length;


document.getElementById(
"verifiedApplications"
).textContent =
verified;


document.getElementById(
"pendingApplications"
).textContent =
pending;


document.getElementById(
"rejectedApplications"
).textContent =
rejected;

}


/* =========================================
RENDER APPLICATIONS
========================================= */

function renderApplications(){

let applications =
getApplications();


const search =
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();


const filter =
document.getElementById(
"statusFilter"
).value;


applications =
applications.filter(app=>{

const text =
[
app.fullName,
app.name,
app.applicant?.fullName,
app.applicant?.name,
app.applicant?.firstName,
app.applicant?.lastName,
app.email,
app.applicant?.email,
app.mobile,
app.phone,
app.applicant?.mobile,
app.applicant?.phone,
app.applicationId,
app.verificationId,
app.city,
app.occupation
]
.join(" ")
.toLowerCase();


const matchesSearch =
!search ||
text.includes(search);


const matchesStatus =
filter==="all" ||
normalizeStatus(
app.status
)===filter;


return matchesSearch &&
matchesStatus;

});

window.renderedApplications = applications;


const list =
document.getElementById(
"applicationList"
);


if(applications.length===0){

list.innerHTML = `
<div class="empty">

<h2>
No applications found
</h2>

<p>
Submitted applications will appear here automatically.
</p>

</div>
`;

return;

}


list.innerHTML =
applications.map(
(app,index)=>
createApplicationCard(
app,index
)
).join("");

}


/* =========================================
APPLICATION CARD
========================================= */

function createApplicationCard(app,index){

const status =
normalizeStatus(
app.status
);


 const applicant =
 app.applicant ||
 {};


 const name =
 app.fullName ||
 app.name ||
 applicant.fullName ||
 applicant.name ||
 [applicant.firstName, applicant.lastName]
 .filter(Boolean)
 .join(" ") ||
"Applicant";


 const email =
 app.email ||
 applicant.email ||
"—";


 const mobile =
 app.mobile ||
 app.phone ||
 applicant.mobile ||
 applicant.phone ||
"—";


 const dob =
 app.dateOfBirth ||
 app.dob ||
 applicant.dateOfBirth ||
 applicant.dob ||
"—";


 const occupation =
 app.occupation ||
 applicant.occupation ||
"—";


 const city =
 app.city ||
 app.address ||
 applicant.city ||
 applicant.address ||
"—";


const docs =
Array.isArray(app.documents)
? app.documents
: Array.isArray(app.uploadedDocuments)
? app.uploadedDocuments
: [];


return `

<article
class="application-card"
data-index="${index}">

<div class="application-header">


<div class="applicant-title">

<div class="avatar">
${escapeHTML(
getInitials(name)
)}
</div>

<div>

<h2>
${escapeHTML(name)}
</h2>

<div class="application-id">

Application ID:
${escapeHTML(
app.applicationId ||
"—"
)}

</div>

</div>

</div>


<span
class="status ${status}">

●
${status}

</span>


</div>


<div class="details-grid">


<div class="detail">
<label>Full Name</label>
<strong>
${escapeHTML(name)}
</strong>
</div>


<div class="detail">
<label>Date of Birth</label>
<strong>
${escapeHTML(dob)}
</strong>
</div>


<div class="detail">
<label>Mobile</label>
<strong>
${escapeHTML(mobile)}
</strong>
</div>


<div class="detail">
<label>Email</label>
<strong>
${escapeHTML(email)}
</strong>
</div>


<div class="detail">
<label>Occupation</label>
<strong>
${escapeHTML(occupation)}
</strong>
</div>


<div class="detail">
<label>City</label>
<strong>
${escapeHTML(city)}
</strong>
</div>


<div class="detail">
<label>Application Date</label>
<strong>
${escapeHTML(
 formatDate(
 app.createdAt || app.submittedAt
 )
)}
</strong>
</div>


<div class="detail">
<label>Documents</label>
<strong>
${docs.length}
Uploaded
</strong>

function toggleDocuments(index){

const box =
document.getElementById(

function getActionApplication(index, applications){

const visible =
window.renderedApplications ||
[];

const target =
visible[index];

if(!target){
return null;
}

return (applications || getApplications()).find(
app => app.applicationId === target.applicationId
) || target;

}

}

/* =========================================
APPROVE APPLICATION
========================================= */

function approveApplication(index){

const applications =
getApplications();

const app =
getActionApplication(index, applications);

if(!app){
return;
}


if(
!confirm(
"Are you sure you want to approve this application?"
)
){
return;
}


app.status="verified";
app.score=100;
app.message=
"Application approved by admin.";
app.verifiedAt=
new Date().toISOString();


if(Array.isArray(app.documents)){

app.documents =
app.documents.map(doc=>({

...doc,
status:"Verified"

}));

}


saveApplications(
applications
);


localStorage.setItem(
"verifyflowApplication",
JSON.stringify(app)
);


renderApplications();

alert(
"Application approved successfully."
);

}


/* =========================================
REJECT APPLICATION
========================================= */

function rejectApplication(index){

const remark =
prompt(
"Enter rejection reason:"
);


if(
!remark ||
!remark.trim()
){
return;
}


const applications =
getApplications();

const app =
getActionApplication(index, applications);

if(!app){
return;
}


app.status="rejected";

app.message=
remark.trim();

app.rejectedAt=
new Date().toISOString();


if(Array.isArray(app.documents)){

app.documents =
app.documents.map(doc=>({

...doc,
status:"Rejected"

}));

}


saveApplications(
applications
);


localStorage.setItem(
"verifyflowApplication",
JSON.stringify(app)
);


renderApplications();

alert(
"Application rejected."
);

}
